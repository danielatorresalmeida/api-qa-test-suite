name: Update API QA Report

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests and generate report
        id: smoke
        run: |
          mkdir -p docs/assets/reports/api-qa
          rm -f docs/assets/reports/api-qa/index.html
          python -m pytest --html=docs/assets/reports/api-qa/index.html --self-contained-html --css=config/pytest-html.css

      - name: Upload report even when tests fail
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' && hashFiles('docs/assets/reports/api-qa/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: api-qa-report-${{ github.run_id }}
          path: docs/assets/reports/api-qa/index.html

      - name: Commit report
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('docs/assets/reports/api-qa/index.html') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets/reports/api-qa/index.html
          git add config/pytest-html.css
          git add docs/index.html docs/.nojekyll
          git diff --staged --quiet && exit 0
          git commit -m "Update API QA report"
          git push
